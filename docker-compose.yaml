services:
  fastapi:
    build: .
    container_name: fastchat_notifications
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    networks:
      - fastchat-net

  mongo:
    image: mongo:latest
    container_name: mongodb_container
    restart: unless-stopped
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE__USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE__PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - fastchat-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:${DATABASE__PORT:-27017}/test --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_container
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DATABASE__USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DATABASE__PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - fastchat-net

volumes:
  mongo-data:
    driver: local
  logs:
    driver: local

networks:
  fastchat-net:
    external: true
